<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#101114"
    >

    <meta
        name="description"
        content="Splatoon 3のバトル履歴・戦績・分析を確認できるWebアプリ"
    >

    <title>InkBoard</title>

    <link
        rel="manifest"
        href="manifest.webmanifest"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<div id="app">

    <!-- =========================
         HEADER
    ========================== -->

    <header class="app-header">

        <div class="header-left">

            <button
                id="backButton"
                class="icon-button header-back"
                type="button"
                data-action="back"
                aria-label="戻る"
                hidden
            >
                <span class="material-symbols-outlined">
                    arrow_back
                </span>
            </button>

            <h1 id="headerTitle">
                バトル
            </h1>

        </div>

        <button
            id="settingsButton"
            class="icon-button"
            type="button"
            data-action="settings"
            aria-label="設定"
        >
            <span class="material-symbols-outlined">
                settings
            </span>
        </button>

    </header>


    <!-- =========================
         MAIN
    ========================== -->

    <main id="mainContent">


        <!-- =========================
             BATTLE PAGE
        ========================== -->

        <section
            id="battlePage"
            class="page"
            data-page="battle"
        >

            <!-- フィルター -->

            <div class="filter-area">

                <button
                    class="filter-button active"
                    type="button"
                    data-battle-filter="all"
                >
                    すべて
                </button>

                <button
                    class="filter-button"
                    type="button"
                    data-battle-filter="rule"
                >
                    ルール
                </button>

                <button
                    class="filter-button"
                    type="button"
                    data-battle-filter="mode"
                >
                    バトルの種類
                </button>

                <button
                    class="filter-button"
                    type="button"
                    data-battle-filter="weapon"
                >
                    ブキ
                </button>

            </div>


            <!-- 戦績サマリー -->

            <section
                id="battleSummary"
                class="battle-summary"
                aria-label="戦績"
            >

                <div class="summary-item">

                    <span class="summary-label">
                        勝率
                    </span>

                    <strong
                        id="summaryWinRate"
                        class="summary-value"
                    >
                        --%
                    </strong>

                </div>


                <div class="summary-item">

                    <span class="summary-label">
                        勝
                    </span>

                    <strong
                        id="summaryWins"
                        class="summary-value"
                    >
                        0
                    </strong>

                </div>


                <div class="summary-item">

                    <span class="summary-label">
                        敗
                    </span>

                    <strong
                        id="summaryLoses"
                        class="summary-value"
                    >
                        0
                    </strong>

                </div>


                <div class="summary-item">

                    <span class="summary-label">
                        戦
                    </span>

                    <strong
                        id="summaryBattles"
                        class="summary-value"
                    >
                        0
                    </strong>

                </div>

            </section>


            <!-- バトル一覧 -->

            <section
                class="battle-history"
                aria-label="バトル履歴"
            >

                <div class="battle-table-header">

                    <span>
                        結果
                    </span>

                    <span>
                        ルール
                    </span>

                    <span>
                        ステージ
                    </span>

                    <span>
                        ブキ
                    </span>

                </div>


                <div
                    id="battleList"
                    class="battle-list"
                >
                </div>


                <!-- データなし -->

                <div
                    id="battleEmpty"
                    class="empty-state"
                    hidden
                >

                    <span class="material-symbols-outlined empty-icon">
                        sports_esports
                    </span>

                    <h2>
                        バトルデータがありません
                    </h2>

                    <p>
                        ホラガイベイから書き出した<br>
                        JSONまたはZIPを読み込んでください。
                    </p>

                    <button
                        class="primary-button"
                        type="button"
                        data-action="import"
                    >
                        <span class="material-symbols-outlined">
                            upload_file
                        </span>

                        データをインポート
                    </button>

                </div>

            </section>

        </section>


        <!-- =========================
             BATTLE DETAIL PAGE
        ========================== -->

        <section
            id="battleDetailPage"
            class="page"
            data-page="battleDetail"
            hidden
        >

            <div
                id="battleDetail"
                class="battle-detail"
            >
            </div>

        </section>


        <!-- =========================
             SALMON RUN PAGE
        ========================== -->

        <section
            id="salmonPage"
            class="page"
            data-page="salmon"
            hidden
        >

            <div class="placeholder-page">

                <span class="material-symbols-outlined">
                    waves
                </span>

                <h2>
                    サーモンラン
                </h2>

                <p>
                    サーモンラン機能は準備中です。
                </p>

            </div>

        </section>


        <!-- =========================
             STATISTICS PAGE
        ========================== -->

        <section
            id="statisticsPage"
            class="page"
            data-page="statistics"
            hidden
        >

            <div class="placeholder-page">

                <span class="material-symbols-outlined">
                    analytics
                </span>

                <h2>
                    統計
                </h2>

                <p>
                    戦績分析機能は準備中です。
                </p>

            </div>

        </section>


        <!-- =========================
             SETTINGS PAGE
        ========================== -->

        <section
            id="settingsPage"
            class="page"
            data-page="settings"
            hidden
        >

            <div class="settings-page">

                <section class="settings-section">

                    <h2>
                        データ
                    </h2>


                    <button
                        id="settingsImportButton"
                        class="settings-button"
                        type="button"
                        data-action="import"
                    >

                        <span class="material-symbols-outlined">
                            upload_file
                        </span>

                        <span class="settings-button-text">

                            <strong>
                                データをインポート
                            </strong>

                            <small>
                                JSON / ZIP
                            </small>

                        </span>

                        <span class="material-symbols-outlined settings-arrow">
                            chevron_right
                        </span>

                    </button>


                    <button
                        id="exportButton"
                        class="settings-button"
                        type="button"
                    >

                        <span class="material-symbols-outlined">
                            download
                        </span>

                        <span class="settings-button-text">

                            <strong>
                                データを書き出す
                            </strong>

                            <small>
                                JSONバックアップ
                            </small>

                        </span>

                        <span class="material-symbols-outlined settings-arrow">
                            chevron_right
                        </span>

                    </button>


                    <button
                        id="deleteAllButton"
                        class="settings-button danger"
                        type="button"
                    >

                        <span class="material-symbols-outlined">
                            delete
                        </span>

                        <span class="settings-button-text">

                            <strong>
                                すべてのデータを削除
                            </strong>

                            <small>
                                保存されている戦績を削除します
                            </small>

                        </span>

                        <span class="material-symbols-outlined settings-arrow">
                            chevron_right
                        </span>

                    </button>

                </section>


                <section class="settings-section">

                    <h2>
                        InkBoard
                    </h2>

                    <div class="settings-info">

                        <span>
                            バージョン
                        </span>

                        <strong>
                            1.0.0
                        </strong>

                    </div>

                </section>

            </div>

        </section>

    </main>


    <!-- =========================
         FILE INPUT
    ========================== -->

    <input
        id="fileInput"
        type="file"
        accept=".json,.zip,application/json,application/zip"
        hidden
    >


    <!-- =========================
         BOTTOM NAVIGATION
    ========================== -->

    <nav
        id="bottomNav"
        class="bottom-nav"
        aria-label="メインナビゲーション"
    >

        <button
            class="nav-item active"
            type="button"
            data-page="battle"
        >

            <span class="material-symbols-outlined">
                sports_esports
            </span>

            <span>
                バトル
            </span>

        </button>


        <button
            class="nav-item"
            type="button"
            data-page="salmon"
        >

            <span class="material-symbols-outlined">
                waves
            </span>

            <span>
                サーモンラン
            </span>

        </button>


        <button
            class="nav-item"
            type="button"
            data-page="statistics"
        >

            <span class="material-symbols-outlined">
                analytics
            </span>

            <span>
                統計
            </span>

        </button>

    </nav>


    <!-- =========================
         TOAST
    ========================== -->

    <div
        id="toast"
        class="toast"
        role="status"
        aria-live="polite"
        hidden
    >
    </div>


    <!-- =========================
         LOADING
    ========================== -->

    <div
        id="loading"
        class="loading-overlay"
        hidden
    >

        <div class="loading-box">

            <div class="loading-spinner"></div>

            <p id="loadingText">
                読み込み中...
            </p>

        </div>

    </div>

</div>


<!-- =========================
     JAVASCRIPT
========================== -->

<script src="js/storage.js"></script>
<script src="js/parser.js"></script>
<script src="js/importer.js"></script>
<script src="js/analyzer.js"></script>
<script src="js/battle.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>

</body>
</html>       データをバックアップ
                    </span>

                </button>

                <button
                    id="clearDataButton"
                    class="settings-item danger"
                    type="button"
                >

                    <span class="material-symbols-rounded">
                        delete
                    </span>

                    <span>
                        保存データを削除
                    </span>

                </button>

            </div>

        </section>

    </main>


    <!-- =========================================
         HIDDEN FILE INPUT
    ========================================== -->

    <input
        id="fileInput"
        type="file"
        accept=".json,.zip,application/json,application/zip"
        hidden
    >


    <!-- =========================================
         BOTTOM NAVIGATION
    ========================================== -->

    <nav
        id="bottomNavigation"
        class="bottom-navigation"
        aria-label="メインナビゲーション"
    >

        <button
            class="nav-item active"
            type="button"
            data-page="battle"
            aria-label="バトル"
        >

            <span class="material-symbols-rounded">
                swords
            </span>

            <span class="nav-label">
                バトル
            </span>

        </button>


        <button
            class="nav-item"
            type="button"
            data-page="salmon"
            aria-label="サーモンラン"
        >

            <span class="material-symbols-rounded">
                water
            </span>

            <span class="nav-label">
                サーモンラン
            </span>

        </button>


        <button
            class="nav-item"
            type="button"
            data-page="statistics"
            aria-label="統計"
        >

            <span class="material-symbols-rounded">
                monitoring
            </span>

            <span class="nav-label">
                統計
            </span>

        </button>

    </nav>

</div>


<!-- =========================================
     JAVASCRIPT
========================================== -->

<script src="js/storage.js"></script>
<script src="js/parser.js"></script>
<script src="js/importer.js"></script>
<script src="js/analyzer.js"></script>
<script src="js/battle.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>

</body>
</html>
