<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#111111"
    >

    <meta
        name="description"
        content="ホラガイベイのバトルデータを閲覧・分析するSplatoon 3向けWebアプリ"
    >

    <link
        rel="manifest"
        href="manifest.webmanifest"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0"
        rel="stylesheet"
    >

    <title>バトル</title>
</head>

<body>

<div id="app">

    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="app-header">

        <div class="header-title-area">

            <button
                id="backButton"
                class="icon-button back-button"
                type="button"
                aria-label="戻る"
                hidden
            >
                <span class="material-symbols-rounded">
                    arrow_back
                </span>
            </button>

            <h1 id="pageTitle">
                バトル
            </h1>

        </div>

        <button
            id="settingsButton"
            class="icon-button"
            type="button"
            aria-label="設定"
        >
            <span class="material-symbols-rounded">
                settings
            </span>
        </button>

    </header>


    <!-- =========================================
         MAIN
    ========================================== -->

    <main id="mainContent">

        <!-- =====================================
             BATTLE LIST PAGE
        ====================================== -->

        <section
            id="battlePage"
            class="page active-page"
            aria-label="バトル一覧"
        >

            <!-- FILTER -->

            <div class="filter-section">

                <div
                    id="battleFilter"
                    class="filter-tabs"
                    role="tablist"
                    aria-label="バトル絞り込み"
                >

                    <button
                        class="filter-tab active"
                        type="button"
                        data-filter="all"
                        role="tab"
                        aria-selected="true"
                    >
                        すべて
                    </button>

                    <button
                        class="filter-tab"
                        type="button"
                        data-filter="rule"
                        role="tab"
                        aria-selected="false"
                    >
                        ルール
                    </button>

                    <button
                        class="filter-tab"
                        type="button"
                        data-filter="mode"
                        role="tab"
                        aria-selected="false"
                    >
                        バトルの種類
                    </button>

                    <button
                        class="filter-tab"
                        type="button"
                        data-filter="weapon"
                        role="tab"
                        aria-selected="false"
                    >
                        ブキ
                    </button>

                </div>

            </div>


            <!-- BATTLE SUMMARY -->

            <section
                id="battleSummary"
                class="battle-summary"
                aria-label="バトル集計"
            >

                <div class="summary-main">

                    <span
                        id="winRate"
                        class="summary-value"
                    >
                        0%
                    </span>

                    <span class="summary-label">
                        勝率
                    </span>

                </div>

                <div class="summary-item">

                    <span
                        id="winCount"
                        class="summary-number"
                    >
                        0
                    </span>

                    <span class="summary-text">
                        勝
                    </span>

                </div>

                <div class="summary-item">

                    <span
                        id="loseCount"
                        class="summary-number"
                    >
                        0
                    </span>

                    <span class="summary-text">
                        敗
                    </span>

                </div>

                <div class="summary-item">

                    <span
                        id="battleCount"
                        class="summary-number"
                    >
                        0
                    </span>

                    <span class="summary-text">
                        戦
                    </span>

                </div>

            </section>


            <!-- BATTLE TABLE -->

            <section
                class="battle-table-section"
                aria-label="バトル履歴"
            >

                <div class="battle-table-header">

                    <span class="result-column">
                        結果
                    </span>

                    <span class="rule-column">
                        ルール
                    </span>

                    <span class="stage-column">
                        ステージ
                    </span>

                    <span class="weapon-column">
                        ブキ
                    </span>

                </div>


                <div
                    id="battleList"
                    class="battle-list"
                >

                    <!--
                        バトルデータは
                        js/ui.js から生成する
                    -->

                </div>


                <!-- EMPTY -->

                <div
                    id="emptyBattle"
                    class="empty-state"
                    hidden
                >

                    <span class="material-symbols-rounded empty-icon">
                        sports_esports
                    </span>

                    <h2>
                        バトルデータがありません
                    </h2>

                    <p>
                        ホラガイベイから出力した
                        データをインポートしてください。
                    </p>

                    <button
                        id="emptyImportButton"
                        class="primary-button"
                        type="button"
                    >
                        データをインポート
                    </button>

                </div>

            </section>

        </section>


        <!-- =====================================
             BATTLE DETAIL PAGE
        ====================================== -->

        <section
            id="battleDetailPage"
            class="page"
            aria-label="バトル詳細"
            hidden
        >

            <div
                id="battleDetail"
                class="battle-detail"
            >

                <!--
                    選択したバトルの詳細は
                    js/battle.js から生成する
                -->

            </div>

        </section>


        <!-- =====================================
             SALMON RUN PAGE
        ====================================== -->

        <section
            id="salmonPage"
            class="page"
            aria-label="サーモンラン"
            hidden
        >

            <div class="coming-soon">

                <span class="material-symbols-rounded">
                    water
                </span>

                <h2>
                    サーモンラン
                </h2>

                <p>
                    サーモンランデータに対応予定
                </p>

            </div>

        </section>


        <!-- =====================================
             STATISTICS PAGE
        ====================================== -->

        <section
            id="statisticsPage"
            class="page"
            aria-label="統計"
            hidden
        >

            <div class="coming-soon">

                <span class="material-symbols-rounded">
                    monitoring
                </span>

                <h2>
                    統計
                </h2>

                <p>
                    バトルデータの統計・分析
                </p>

            </div>

        </section>


        <!-- =====================================
             SETTINGS PAGE
        ====================================== -->

        <section
            id="settingsPage"
            class="page"
            aria-label="設定"
            hidden
        >

            <div class="settings-content">

                <h2>
                    設定
                </h2>

                <button
                    id="importButton"
                    class="settings-item"
                    type="button"
                >

                    <span class="material-symbols-rounded">
                        upload_file
                    </span>

                    <span>
                        バトルデータをインポート
                    </span>

                </button>

                <button
                    id="exportButton"
                    class="settings-item"
                    type="button"
                >

                    <span class="material-symbols-rounded">
                        download
                    </span>

                    <span>
                        データをバックアップ
                    </span>

                </button>

                <button
                    id="clearDataButton"
                    class="settings-item danger"
                    type="button"
                >

                    <span class="material-symbols-rounded">
                        delete
                    </span>

                    <span>
                        保存データを削除
                    </span>

                </button>

            </div>

        </section>

    </main>


    <!-- =========================================
         HIDDEN FILE INPUT
    ========================================== -->

    <input
        id="fileInput"
        type="file"
        accept=".json,.zip,application/json,application/zip"
        hidden
    >


    <!-- =========================================
         BOTTOM NAVIGATION
    ========================================== -->

    <nav
        id="bottomNavigation"
        class="bottom-navigation"
        aria-label="メインナビゲーション"
    >

        <button
            class="nav-item active"
            type="button"
            data-page="battle"
            aria-label="バトル"
        >

            <span class="material-symbols-rounded">
                swords
            </span>

            <span class="nav-label">
                バトル
            </span>

        </button>


        <button
            class="nav-item"
            type="button"
            data-page="salmon"
            aria-label="サーモンラン"
        >

            <span class="material-symbols-rounded">
                water
            </span>

            <span class="nav-label">
                サーモンラン
            </span>

        </button>


        <button
            class="nav-item"
            type="button"
            data-page="statistics"
            aria-label="統計"
        >

            <span class="material-symbols-rounded">
                monitoring
            </span>

            <span class="nav-label">
                統計
            </span>

        </button>

    </nav>

</div>


<!-- =========================================
     JAVASCRIPT
========================================== -->

<script src="js/storage.js"></script>
<script src="js/parser.js"></script>
<script src="js/importer.js"></script>
<script src="js/analyzer.js"></script>
<script src="js/battle.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>

</body>
</html>
